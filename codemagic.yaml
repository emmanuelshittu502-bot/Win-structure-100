workflows:
  win-map-android:
    name: Win Map APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.22.1
      java: 17
    scripts:
      - name: Auto-fix package name from google-services.json
        script: |
          echo "--- google-services.json package name ---"
          cat android/app/google-services.json | grep -A2 package_name
          PKG=$(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "Found package: $PKG"
          echo "Setting applicationId to $PKG in build.gradle"
          # Patch build.gradle
          sed -i "" "s/applicationId \".*\"/applicationId \"$PKG\"/" android/app/build.gradle 2>/dev/null || sed -i "s/applicationId \".*\"/applicationId \"$PKG\"/" android/app/build.gradle
          grep applicationId android/app/build.gradle
      - name: Build APK with Firebase
        script: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
