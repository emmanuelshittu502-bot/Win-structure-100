workflows:
  win-map-android:
    name: Win Map APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.22.1
      java: 17
    scripts:
      - name: Build APK with Firebase
        script: |
          echo "Checking for google-services.json..."
          ls -lh android/app/google-services.json
          cat android/app/google-services.json | grep package_name
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
