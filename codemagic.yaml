workflows:
  win-map-android:
    name: Win Map APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.22.1
      java: 17
    scripts:
      - name: Fix Gradle Error - Recreate Android folder
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.winmap --project-name win_map
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
