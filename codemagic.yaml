workflows:
  win-map-android:
    name: Win Map APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.22.1
      java: 17
    scripts:
      - name: Fix Android Folder Completely
        script: |
          cp android/app/google-services.json /tmp/google-services.json
          PKG=$(python3 -c "import json; print(json.load(open('/tmp/google-services.json'))['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "Firebase package is: $PKG"
          ORG=$(echo $PKG | rev | cut -d'.' -f2- | rev)
          NAME=$(echo $PKG | rev | cut -d'.' -f1 | rev)
          echo "Org: $ORG Name: $NAME"
          rm -rf android
          flutter create --org $ORG --project-name $NAME --platforms=android .
          cp /tmp/google-services.json android/app/google-services.json
          ls -l android/app/google-services.json
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
